name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_ID: com.gayatripatel.taskflow.maui

jobs:
  core-tests:
    name: Core + view model tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/TaskFlow.Core.Tests/TaskFlow.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  android:
    name: Android build + emulator screenshots
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/TaskFlow.Maui/TaskFlow.Maui.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Publish release APK
        run: >
          dotnet publish src/TaskFlow.Maui/TaskFlow.Maui.csproj -f net10.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_HOME" -o artifacts/android

      - name: Locate signed APK
        run: |
          ls -la artifacts/android
          cp "$(ls artifacts/android/*-Signed.apk | head -n 1)" artifacts/TaskFlow.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Plain AOSP image: lighter than google_apis, so the launcher doesn't stall on a cold boot.
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh ${{ env.APP_ID }} artifacts/TaskFlow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-maui-android
          path: |
            artifacts/TaskFlow.apk
            docs/screenshots/*.png

      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: update screenshots [skip ci]"
            git pull --rebase
            git push
          fi

  windows:
    name: Windows (WinUI) build
    needs: core-tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build Windows app
        run: dotnet build src/TaskFlow.Maui/TaskFlow.Maui.csproj -f net10.0-windows10.0.19041.0 -c Release
